<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t">
<title id="t">佐藤 大喜, web creator</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#070b17"/><stop offset=".55" stop-color="#2a1f5c"/><stop offset="1" stop-color="#ff7a59"/>
</linearGradient>
<radialGradient id="sun">
<stop offset="0" stop-color="#ffe2b8" stop-opacity=".95"/><stop offset=".4" stop-color="#ffb86b" stop-opacity=".4"/><stop offset="1" stop-color="#ffb86b" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#fff3e6"/><stop offset=".5" stop-color="#ffb86b"/><stop offset="1" stop-color="#fff3e6"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="420 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
<feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="frame"><rect width="1000" height="300" rx="20"/></clipPath>
</defs>
<style>
.s{font:700 28px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#ffd9b3;opacity:0;animation:rise 9s linear infinite}
.d{font-size:22px;fill:#b9a8ff;fill-opacity:.6}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}80%{opacity:.85}100%{transform:translateY(-240px);opacity:0}}
.n{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Segoe UI',sans-serif;font-weight:800;font-size:76px;letter-spacing:12px}
.sub{font:500 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#ffd9b3;letter-spacing:1px}
@media (prefers-reduced-motion:reduce){.s{animation:none;opacity:.35}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="300" fill="url(#sky)"/>
<g filter="url(#blur)" opacity=".7">
<ellipse cx="220" cy="90" rx="190" ry="70" fill="#7c5cff"><animate attributeName="cx" values="220;430;220" dur="14s" repeatCount="indefinite"/></ellipse>
<ellipse cx="760" cy="60" rx="220" ry="60" fill="#ff7a59" opacity=".6"><animate attributeName="cx" values="760;560;760" dur="17s" repeatCount="indefinite"/></ellipse>
</g>
<circle cx="840" cy="305" r="190" fill="url(#sun)"><animate attributeName="cy" values="310;272;310" dur="9s" repeatCount="indefinite"/></circle>
<g fill="#fff3e6">
<circle cx="90" cy="40" r="1.6"><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="210" cy="24" r="1.2"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" begin="-1s" repeatCount="indefinite"/></circle>
<circle cx="330" cy="62" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.6s" begin="-2s" repeatCount="indefinite"/></circle>
<circle cx="455" cy="30" r="1.3"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" begin="-.5s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="52" r="1.7"><animate attributeName="opacity" values=".15;1;.15" dur="4s" begin="-3s" repeatCount="indefinite"/></circle>
<circle cx="650" cy="22" r="1.2"><animate attributeName="opacity" values=".15;1;.15" dur="3.2s" begin="-1.5s" repeatCount="indefinite"/></circle>
<circle cx="740" cy="72" r="1.4"><animate attributeName="opacity" values=".15;1;.15" dur="2.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
<circle cx="830" cy="34" r="1.6"><animate attributeName="opacity" values=".15;1;.15" dur="3.4s" begin="-.8s" repeatCount="indefinite"/></circle>
<circle cx="930" cy="58" r="1.2"><animate attributeName="opacity" values=".15;1;.15" dur="2.9s" begin="-2.6s" repeatCount="indefinite"/></circle>
<circle cx="985" cy="20" r="1.5"><animate attributeName="opacity" values=".15;1;.15" dur="3.8s" begin="-1.2s" repeatCount="indefinite"/></circle>
</g>
<g>
<line x1="0" y1="0" x2="90" y2="-50" stroke="#fff3e6" stroke-width="2" stroke-linecap="round"/>
<animateTransform attributeName="transform" type="translate" values="960 10;560 230" dur="7s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.12;.35;1" dur="7s" repeatCount="indefinite"/>
</g>
<text class="s" x="70" y="292" style="animation-delay:-1s;animation-duration:9s">&lt;/&gt;</text>
<text class="s d" x="150" y="292" style="animation-delay:-5.5s;animation-duration:11s">{ }</text>
<text class="s" x="235" y="292" style="animation-delay:-3s;animation-duration:8s">=&gt;</text>
<text class="s d" x="320" y="292" style="animation-delay:-7s;animation-duration:10s">#</text>
<text class="s d" x="410" y="292" style="animation-delay:-2s;animation-duration:12s">;</text>
<text class="s d" x="590" y="292" style="animation-delay:-6s;animation-duration:9s">[ ]</text>
<text class="s" x="680" y="292" style="animation-delay:-4s;animation-duration:11s">( )</text>
<text class="s" x="760" y="292" style="animation-delay:-8.5s;animation-duration:8.5s">&amp;&amp;</text>
<text class="s" x="840" y="292" style="animation-delay:-1.5s;animation-duration:10s">py</text>
<text class="s" x="900" y="292" style="animation-delay:-9s;animation-duration:9s">js</text>
<text class="s" x="950" y="292" style="animation-delay:-5s;animation-duration:12s">ts</text>
<text class="s" x="40" y="292" style="animation-delay:-6.5s;animation-duration:13s">*</text>
<text class="s d" x="500" y="292" style="animation-delay:-10s;animation-duration:14s">01</text>
<text class="s d" x="120" y="292" style="animation-delay:-8s;animation-duration:10s">~</text>
<text class="n" x="506" y="150" text-anchor="middle" fill="url(#ink)" filter="url(#glow)">佐藤 大喜</text>
<text class="sub" x="500" y="198" text-anchor="middle">Web creator. Open for commissions.</text>
<rect x="500" y="214" width="0" height="3" rx="1.5" fill="#ffb86b">
<animate attributeName="width" values="0;140;140;0" keyTimes="0;.3;.8;1" dur="6s" repeatCount="indefinite"/>
<animate attributeName="x" values="500;430;430;500" keyTimes="0;.3;.8;1" dur="6s" repeatCount="indefinite"/>
</rect>
<path d="M0 256 Q125 226 250 256 T500 256 T750 256 T1000 256 T1250 256 T1500 256 V300 H0 Z" fill="#0b1020" fill-opacity=".55">
<animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite"/>
</path>
<path d="M0 270 Q125 246 250 270 T500 270 T750 270 T1000 270 T1250 270 T1500 270 V300 H0 Z" fill="#070b17" fill-opacity=".9">
<animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
</path>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="20" fill="none" stroke="#ffb86b" stroke-opacity=".25"/>
</svg>
