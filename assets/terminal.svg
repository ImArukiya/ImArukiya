<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-label="Animated terminal that types out a short intro">
<title>about.sh</title>
<defs>
<clipPath id="body"><rect x="10" y="10" width="740" height="240" rx="14"/></clipPath>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1f5c"/><stop offset="1" stop-color="#3b2f6b"/></linearGradient>
</defs>
<style>
text{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#f3e9dc}
.p{fill:#5eead4}
.o{fill:#ffb86b}
.m{font-size:12px;fill:#cdbfae}
.cur{fill:#5eead4}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.c1{animation:k1 16s steps(8,end) infinite}
.c2{animation:k2 16s steps(30,end) infinite}
.c3{animation:k3 16s steps(15,end) infinite}
.c4{animation:k4 16s steps(34,end) infinite}
.c5{animation:k5 16s steps(16,end) infinite}
.c6{animation:k6 16s steps(45,end) infinite}
@keyframes k1{0%,3.1%{transform:translateX(0);opacity:1}6.25%{transform:translateX(72px);opacity:1}6.26%,93.7%{transform:translateX(72px);opacity:0}93.8%,100%{transform:translateX(0);opacity:1}}
@keyframes k2{0%,8.1%{transform:translateX(0);opacity:1}18.75%{transform:translateX(270px);opacity:1}18.76%,93.7%{transform:translateX(270px);opacity:0}93.8%,100%{transform:translateX(0);opacity:1}}
@keyframes k3{0%,22.5%{transform:translateX(0);opacity:1}28.1%{transform:translateX(135px);opacity:1}28.11%,93.7%{transform:translateX(135px);opacity:0}93.8%,100%{transform:translateX(0);opacity:1}}
@keyframes k4{0%,30%{transform:translateX(0);opacity:1}41.9%{transform:translateX(306px);opacity:1}41.91%,93.7%{transform:translateX(306px);opacity:0}93.8%,100%{transform:translateX(0);opacity:1}}
@keyframes k5{0%,45.6%{transform:translateX(0);opacity:1}51.25%{transform:translateX(144px);opacity:1}51.26%,93.7%{transform:translateX(144px);opacity:0}93.8%,100%{transform:translateX(0);opacity:1}}
@keyframes k6{0%,53.1%{transform:translateX(0)}68.75%,93.7%{transform:translateX(405px)}93.8%,100%{transform:translateX(0)}}
</style>
<g clip-path="url(#body)">
<rect x="10" y="10" width="740" height="240" fill="#0b1020"/>
<rect x="10" y="10" width="740" height="40" fill="url(#bar)"/>
<circle cx="34" cy="30" r="6" fill="#ff7a59"/><circle cx="56" cy="30" r="6" fill="#ffb86b"/><circle cx="78" cy="30" r="6" fill="#5eead4"/>
<text class="m" x="380" y="34" text-anchor="middle">about.sh</text>
<text x="40" y="88" textLength="72"><tspan class="p">$</tspan> whoami</text>
<text x="40" y="116" textLength="270"><tspan class="o">&gt;</tspan> web creator, always building</text>
<text x="40" y="144" textLength="135"><tspan class="p">$</tspan> cat stack.txt</text>
<text x="40" y="172" textLength="306"><tspan class="o">&gt;</tspan> html css js ts react node python</text>
<text x="40" y="200" textLength="144"><tspan class="p">$</tspan> ./status --now</text>
<text x="40" y="228" textLength="405"><tspan class="o">&gt;</tspan> building my portfolio. open for commissions</text>
<g class="c1"><rect x="40" y="71" width="72" height="24" fill="#0b1020"/><rect class="cur" x="40" y="73" width="2.5" height="19"/></g>
<g class="c2"><rect x="40" y="99" width="270" height="24" fill="#0b1020"/><rect class="cur" x="40" y="101" width="2.5" height="19"/></g>
<g class="c3"><rect x="40" y="127" width="135" height="24" fill="#0b1020"/><rect class="cur" x="40" y="129" width="2.5" height="19"/></g>
<g class="c4"><rect x="40" y="155" width="306" height="24" fill="#0b1020"/><rect class="cur" x="40" y="157" width="2.5" height="19"/></g>
<g class="c5"><rect x="40" y="183" width="144" height="24" fill="#0b1020"/><rect class="cur" x="40" y="185" width="2.5" height="19"/></g>
<g class="c6"><rect x="40" y="211" width="405" height="24" fill="#0b1020"/><rect class="cur blink" x="40" y="213" width="2.5" height="19"/></g>
</g>
<rect x="10.5" y="10.5" width="739" height="239" rx="14" fill="none" stroke="#ffb86b" stroke-opacity=".3"/>
</svg>
